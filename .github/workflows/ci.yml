name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: |
          python -m py_compile scripts/memcarry_store.py
          python -m py_compile benchmarks/continuity_baseline.py
          python -m py_compile benchmarks/machine_benchmark.py
          python -m py_compile benchmarks/startup_breakdown.py
          python -m py_compile benchmarks/scope_first_ab.py
          python -m py_compile benchmarks/scope_first_three_way.py
          python -m compileall -q src
      - name: Tests
        run: python -m unittest discover -s tests -v

  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NPM package checks
        run: |
          node --check bin/memcarry.mjs
          node --check bin/lib/installer.mjs
          npm test

  benchmark-startup:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh-process startup breakdown
        run: |
          python benchmarks/startup_breakdown.py \
            --iterations 20 \
            --output startup-breakdown.json
      - uses: actions/upload-artifact@v4
        with:
          name: startup-breakdown
          path: startup-breakdown.json

  benchmark-baseline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Continuity baseline
        run: |
          python benchmarks/continuity_baseline.py \
            --sizes 1000,10000,50000,100000 \
            --warmup 5 \
            --iterations 30 \
            --subprocess-iterations 10 \
            --output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-benchmark-baseline
          path: benchmark-results.json

  benchmark-scope-first-3way:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Broad vs two-index vs single-index scope FTS
        run: |
          python benchmarks/scope_first_three_way.py \
            --sizes 1000,10000,50000,100000 \
            --warmup 5 \
            --iterations 30 \
            --output scope-first-three-way-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: scope-first-fts-three-way
          path: scope-first-three-way-results.json
